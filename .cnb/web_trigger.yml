# =====================================================================
# 分支详情页自定义按钮
#
# 说明：
#   - 按钮仅显示在「代码-分支详情页」，点击后触发 .cnb.yml 中同名
#     web_trigger_* 事件对应的流水线
#   - 本文件不支持 include 和 imports 语法
#   - 事件需在 .cnb.yml 中定义，否则点击无效果
#     对应配置见 .cnb.yml 的 $ 兜底分支下的 web_trigger_codewiki
# =====================================================================
branch:
  # CodeWiki 面向 main 分支代码生成，故按钮只在 main 分支详情页出现，
  # 避免在特性分支上误触发、生成中间态的 Wiki
  - reg: ^main$
    buttons:
      - name: 生成 CodeWiki
        description: 手动触发 CodeWiki 全量生成（耗时长，用于首次生成或补跑）
        event: web_trigger_codewiki
        groupName: 文档知识化
        # CodeWiki 单次生成耗时长（可达数小时）且占用构建资源，
        # 限定管理员与负责人可触发；注意角色非向上包含，故两类都需列出
        permissions:
          roles:
            - master
            - owner
