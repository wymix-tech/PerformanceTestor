[project]
name = "perf-py"
version = "0.1.0"
description = "PerformanceTestor Python 工程层：可重复压测脚本（场景即代码）+ AI Agent 工具层（Issue #23）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "typer>=0.12,<1",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
    "httpx>=0.27,<1",
    "rich>=13,<14",
]

[project.scripts]
perf = "perf_cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 阶段 1 先纳入 perf_cli 与 scenario，阶段 2/3 逐步补 engine/tools
packages = ["perf_cli", "scenario"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
# B008：typer 的 Option/Argument 需要在参数默认值处调用，属框架约定而非缺陷
extend-ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
