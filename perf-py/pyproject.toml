[project]
name = "perf-py"
version = "0.1.0"
description = "PerformanceTestor Python 工程层：可重复压测脚本（场景即代码）+ AI Agent 工具层（Issue #23）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "typer>=0.12,<1",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
    "httpx>=0.27,<1",
    "rich>=13,<14",
]

[project.scripts]
perf = "perf_cli.main:app"
perf-engine = "perf_cli.engine_entry:main"

[project.optional-dependencies]
# 本地引擎（阶段 2）：locust 带 gevent，仅 perf-engine 需要
locust = ["locust>=2.29,<3"]
datagen-parsers = [
    "tree-sitter>=0.23,<0.26",
    "tree-sitter-java>=0.23,<0.26",
]
# 灌数生产驱动（阶段 3 步骤 5）：方言 connect() 懒加载，仅真实库执行需要
datagen-drivers = [
    "pymysql>=1.1,<2",
    "psycopg2-binary>=2.9,<3",
]
# Agent 编排（阶段 4 步骤 2）：OpenAI 兼容 API 客户端，仅真实 LLM 调用需要
agents = ["openai>=1.40,<2"]
# datagen 写路径（阶段 5 步骤 7）：db_conn 凭据 AES-GCM 解密（对齐 Java CryptoService）
security = ["cryptography>=42"]
# server 骨架（阶段 4 步骤 3）：FastAPI + uvicorn（SSE 用标准 StreamingResponse，无 sse-starlette 依赖）
# 阶段 5 步骤 2 起 stress 域数据层走 SQLAlchemy（测试默认 sqlite，生产指 MySQL）
# 阶段 5 步骤 5 auth 域：pyjwt 签发/校验 HS256（与 Java jjwt 跨侧互验）
server = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "pyjwt>=2.8,<3",
]

[dependency-groups]
dev = [
    "cryptography>=50.0.2",
    "pytest>=8,<9",
    "ruff>=0.6",
    # datagen 源码解析层（阶段 3 步骤 4d）测试需要
    "tree-sitter>=0.23,<0.26",
    "tree-sitter-java>=0.23,<0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 阶段 1：perf_cli + scenario；阶段 2 增加 engine；阶段 3 增加 datagen；阶段 4 增加 tools/agents/server
packages = ["perf_cli", "scenario", "engine", "datagen", "tools", "agents", "server"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
# B008：typer 的 Option/Argument 需要在参数默认值处调用，属框架约定而非缺陷
extend-ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
