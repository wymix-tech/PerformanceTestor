# =====================================================================
# PerformanceTestor PR 门禁流水线
# 目标：防回归——后端全模块单元测试 + 前端类型检查与构建
#
# 说明：
#   - 后端为 Maven 多模块（perf-server / perf-agent / perf-datagen / perf-demo）
#   - 依赖真实数据库的 *LiveTest 已用 Assumptions.assumeTrue 自跳过，
#     无需额外排除规则即可无库运行
#   - 两个 Job 并行执行，任一失败则 PR 门禁不通过
#
# 修复要点（上一轮踩坑）：父层 docker.volumes 的 m2 卷不会自动下传到用
# image 覆盖了镜像的子 Job，导致子 Job 内 Maven 找不到 /root/.m2 目录。
# 现在的做法：所有子 Job 自带 image，依赖仓库缓存直接声明在各自 image 上。
# =====================================================================
main:
  pull_request:
    - name: pr-gate
      stages:
        - name: quality-gate
          jobs:
            backend:
              name: 后端单元测试
              # 与项目 maven.compiler.release=17 及本地开发环境对齐。
              # 高版本 JDK 编低版本目标虽可工作（--release 17），但未来版本可能移除
              # 对旧 release 的支持，且易造成「本地过了 CI 挂」的版本漂移。
              image: maven:3.9-eclipse-temurin-17
              # Maven 依赖缓存：跨构建复用，避免每次全量下载（cow 写时复制，支持并行 Job）
              docker:
                volumes:
                  - cache:/root/.m2:rw
              env:
                # 把 .m2 仓库固定到挂载点，触发缓存命中
                MAVEN_OPTS: -Dmaven.repo.local=/root/.m2/repository
              script: |
                set -e
                mvn -B -ntp test
            frontend:
              name: 前端类型检查与构建
              # 必须 >= 22：StrykerJS 10 要求 node>=22（node:20 会直接启动失败）。
              # 前端产物是静态资源、运行期在浏览器，构建期 Node 版本不影响部署环境。
              image: node:22
              docker:
                volumes:
                  - cache:/root/.npm:rw
              env:
                # npm 缓存命中关键：让 ci 与 build 走同一份全局缓存
                npm_config_cache: /root/.npm
              script: |
                set -e
                cd perf-web
                npm ci
                npm run build
                # 突变测试门禁（仅对已有单测覆盖的文件，约 12 秒）。
                # 全量突变（npm run test:mutation:all）需约 40 分钟，不接入 CI。
                npm run test:mutation
            # perf-py（Issue #23 阶段 1）：Python 工程层门禁——lint + 单测 +
            # 入库场景校验。场景即代码，场景文件写错应在 PR 阶段拦截。
            python:
              name: perf-py lint 与单测
              image: python:3.12-slim
              docker:
                volumes:
                  - cache:/root/.cache:rw
              env:
                # 容器卷与 uv 缓存可能不在同一文件系统，copy 模式消除硬链接告警噪音
                UV_LINK_MODE: copy
              script: |
                set -e
                pip install --quiet uv
                cd perf-py
                # --extra locust：阶段 2 本地引擎依赖，保证 locust 用例真实执行（非 skip）
                uv sync --frozen --extra locust
                uv run ruff check .
                uv run pytest

  # =====================================================================
  # 文档知识化流水线
  # 目标：main 分支代码更新后，自动维护知识库与 CodeWiki
  #
  # 触发说明：PR 合并到 main 时，平台会触发 main 分支的 push 事件
  #   （「a 分支合并到 b 分支，会触发 b 分支下的 pull_request.merged、push 事件」），
  #   故本配置同时覆盖「PR 合并后」与「直接 push 到 main」两种场景，无需再配 merged。
  #
  # 两条流水线职责不同，拆开并行执行：
  #   1. knowledge-base —— 收录 docs/ 文档与仓库 Issue（轻量、增量，每次都跑）
  #   2. codewiki      —— LLM 全量分析代码生成 Wiki（重量、耗时久，加锁防堆积）
  # =====================================================================
  push:
    - name: knowledge-base
      stages:
        - name: 构建知识库
          type: knowledge:update
          options:
            # 本项目 19 个 Markdown 全部集中在 docs/ 下（设计 / 交接 / 方案 / 报告），
            # 根目录无 README，故显式收窄到 docs/ 以免误收模板与脚手架里的说明文件
            include: "docs/**/*.md"
            # 必排除：插件默认 include 为 **/**.md，会扫到 node_modules（实测 536 个 md）
            # 与 Maven/前端构建产物，既拖慢入库也污染召回质量
            exclude:
              - "**/node_modules/**"
              - "**/target/**"
              - "**/dist/**"
              - "**/.codebuddy/**"
            # Issue 一并入库：需求背景与缺陷结论是问答高频来源，默认已开启，显式声明以防后人误关
            issueSyncEnabled: true
            # 文档同步是增强能力而非门禁，单篇解析失败不应让整条 push 流水线变红
            ignoreProcessFailures: true

    - name: codewiki
      # CodeWiki 由 LLM 通读代码生成，单次耗时可达数十分钟至数小时。
      # 连续 push 时加锁，且只保留队列中最新一次 —— 中间态代码的 Wiki 没有价值，
      # 排队逐个生成会白白吃掉大量构建时长（wait=true 等待而非丢弃，cancel-in-wait 丢弃排队中的旧任务）
      lock:
        key: codewiki
        wait: true
        cancel-in-wait: true
      stages:
        - name: 生成 CodeWiki
          image: cnbcool/codewiki:latest
          # 插件超时上限 12h；大型仓库全量生成可能超过默认 2h，故放宽到 10h
          timeout: 10h
          settings:
            git_doc_dir: /data/codewiki/${CNB_REPO_SLUG}
            # 生成的 Wiki 自动入库，与 knowledge-base 收录的原始文档、Issue 互补：
            # 前者是「人写的意图与结论」，后者是「代码实际长什么样」
            knowledge_enabled: true

# =====================================================================
# 兜底分支：手动触发入口
#
# CodeWiki 首次生成耗时长，且插件偶发失败时也需要补跑，
# 故额外提供手动入口，可在页面「手动触发构建」中选择该事件按需执行，
# 不必为了重跑而往 main 上推一个空提交。
# =====================================================================
$:
  web_trigger_codewiki:
    - name: codewiki-manual
      stages:
        - name: 生成 CodeWiki
          image: cnbcool/codewiki:latest
          timeout: 10h
          settings:
            git_doc_dir: /data/codewiki/${CNB_REPO_SLUG}
            knowledge_enabled: true