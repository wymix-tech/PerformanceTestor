# =====================================================================
# 后端文案（P3-1，默认语言 zh_CN）
#
# 约定：
#   1. key 按「模块.语义」分层；只抽「会返回给用户」的文案（ApiResponse.message /
#      校验错误 / 自检指引），日志与内部异常不抽——日志面向运维看堆栈，翻译无意义。
#   2. 参数用 {0} {1} 占位（MessageSource 位置参数），禁止在 Java 里拼串，
#      否则英文语序无法重排。
#   3. messages_en.properties 必须与本文件 key 完全对齐，由 LocaleMessagesParityTest 断言。
#   4. 尚未迁移的模块仍返回硬编码中文，属「按需迁移」范围，不要求一次性全量替换。
# =====================================================================

# ---- 通用 ----
common.success=success
common.error.internal=服务器内部错误: {0}
common.error.badRequest=请求参数错误: {0}

# ---- 鉴权 ----
auth.missing.credentials=请输入账号与密码
auth.invalid.credentials=账号或密码错误
auth.secret.tooShort=perf.auth.secret 长度不足 32 字节，无法用于 HS256 签名
