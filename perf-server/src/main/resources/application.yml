# =====================================================================
# PerformanceTestor perf-server 全局配置
# 多机分离部署关键配置说明：
#   1. 平台服务器：本文件即平台配置（perf-server + MySQL + 源码存储）
#   2. 被测服务器：agent 上报地址在 start-agent.sh 的 REPORT_URL 配置
#   3. 网络：平台→被测（压测端口）、被测→平台（本机 8080 上报端口）、平台→被测库（3306）
# =====================================================================
server:
  port: 8080

spring:
  application:
    name: perf-server
  datasource:
    # 平台库：存元数据 / 时序指标 / 任务 / 源码索引 / 问题与方案
    # 敏感信息支持环境变量覆盖（MYSQL_USER / MYSQL_PASSWORD）
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/performance_testor?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&allowMultiQueries=true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.perfserver.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# ===== 平台业务配置 =====
perf:
  # 轻量 JWT 鉴权（管理员账号支持环境变量注入：PERF_ADMIN_USER / PERF_ADMIN_PASSWORD / PERF_JWT_SECRET）
  # 白名单：/api/auth/**（登录）与 /api/agent/**（探针上报走独立令牌校验）
  auth:
    enabled: true
    username: ${PERF_ADMIN_USER:admin}
    password: ${PERF_ADMIN_PASSWORD:admin123}
    secret: ${PERF_JWT_SECRET:perf-testor-default-jwt-secret-please-change-in-production}
    expire-hours: 12
    # 探针上报令牌：配置后 /api/agent/** 需携带 X-Perf-Agent-Token 请求头（agent 侧 agentToken=<值>）
    # 留空 = 不校验，保持开放（兼容存量 agent 与内网演示）
    agent-token: ${PERF_AGENT_TOKEN:}
    # 静态 API Token：供 CI 流水线调用压测/门禁接口，请求头 X-Perf-Api-Token
    # 留空 = 不启用
    api-token: ${PERF_API_TOKEN:}

  # 敏感凭据加密（DbConn 数据库密码 / DeployConn SSH 凭据）
  # 密钥走环境变量，任意长度口令（内部 SHA-256 归一化为 AES-256 密钥）
  # 留空 = 不加密（内网演示）；存量明文凭据在下次保存时自动转为密文
  crypto:
    secret: ${PERF_CRYPTO_SECRET:}
  # 源码文件存储根目录（平台服务器磁盘）
  source:
    storage-dir: /data/perf-source
    max-file-size-mb: 1        # 单文件上限 MB
    max-total-size-mb: 200     # 仓库总大小上限 MB
    max-file-count: 5000       # 仓库文件数上限

  # 压测引擎配置
  stress:
    default-engine: http       # http / jmeter
    max-concurrency: 5000      # 并发上限保护
    max-duration-sec: 3600     # 时长上限保护
    qps-sampling-interval-sec: 2  # QPS 采样周期
    # JMeter 安装目录（bin/jmeter 的父目录，空则探测 PATH；未安装时 jmeter 引擎任务创建即被拒绝）
    jmeter-home: ${JMETER_HOME:}
    # 压测请求客户端配置
    connect-timeout-ms: 3000
    read-timeout-ms: 30000

  # 容量评估与扩容建议
  capacity:
    target-p95-ms: 200         # 目标 P95 RT 阈值（容量评估与扩容触发共用）
    cpu-threshold: 80          # CPU 使用率触发扩容阈值 %
    error-rate-threshold: 0.05 # 错误率触发阈值
    thread-pool-usage-threshold: 0.9  # 线程池活跃占比触发阈值
    full-gc-threshold: 5       # 每分钟 Full GC 次数触发阈值
    sample-window-min: 30      # 扩容建议分析时间窗口（分钟）

  # AI 大模型配置（OpenAI 兼容 API；无 key 时自动降级规则示例模式）
  ai:
    enabled: true
    base-url: ${PERF_AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${PERF_AI_API_KEY:}
    model: gpt-4o-mini
    timeout-sec: 60
    # 流式对话（SSE）超时秒数：需覆盖多轮工具执行耗时，建议 >= 300
    stream-timeout-sec: 300
    # 流式对话处理线程数
    stream-threads: 4
    # 并发限流
    max-concurrent-requests: 4

  # 修复效果自动验证
  verify:
    # 等待重放压测完成的超时（秒）
    timeout-sec: 300
    # 并发等待验证的线程数（每次验证会重放一次完整压测，放宽会同时占用目标服务压测资源）
    max-concurrent: 2

  # 数据生命周期：分区自动维护 + 保留期回收（PartitionMaintainer）
  retention:
    enabled: true              # 总开关：关闭后既不建分区也不清理
    interval-hours: 1          # 定时周期（小时）；启动时另有一次立即执行
    ahead-days: 2              # 提前创建的未来分区天数（覆盖周末/短假期）
    partition-days: 30         # jvm_metric / stress_sample 分区保留天数，0 = 不清理（只建分区）
    trace-chain-days: 30       # trace_chain 保留天数，0 = 不清理（分批 DELETE）
    slow-sql-days: 30          # slow_sql 保留天数，0 = 不清理
    slow-command-days: 30      # slow_command 保留天数，0 = 不清理
    delete-batch-size: 5000    # 每批删除行数（防单事务过大阻塞写入）
    max-batches-per-run: 20    # 每轮每表最多删除批数（防单次扫描吃满 IO）

  # Agent 上报接口配置
  agent:
    # 上报数据落库的采样写入批大小
    batch-size: 200
    # 上报缓冲区（agent 侧）上限，超出丢弃旧数据
    buffer-size: 5000

logging:
  level:
    root: info
    com.perfserver: info
    com.perfagent: info
  file:
    name: logs/perf-server.log
