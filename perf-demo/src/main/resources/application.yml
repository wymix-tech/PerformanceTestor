# perf-demo 示例被测应用配置
# 默认端口 8081；数据库为独立 demo 库（与平台 performance_testor 库分离）
server:
  port: 8081

spring:
  application:
    name: perf-demo
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/demo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&createDatabaseIfNotExist=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20

# 演示数据开关：默认 true（启动即灌 1 万用户 + 5 万订单，供压测产生可观测瓶颈）。
# 需要纯净被测库时设为 false（或启动参数 --demo.data.enabled=false）：仅建表，不写入任何数据。
demo:
  data:
    enabled: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    com.perfdemo: info
